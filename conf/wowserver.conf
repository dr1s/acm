# Name prefix for Docker images (e.g. playerbots/ac-wotlk-worldserver).
NAME=playerbots

# Main repository (the base AzerothCore fork).
# Uncomment and edit to use a different upstream.
# To use a specific branch, append @branch_name: https://github.com/user/repo.git@branch
MAIN_REPO=https://github.com/mod-playerbots/azerothcore-wotlk.git

# Module repositories to clone into ./modules.
# To use a specific branch, append @branch_name: https://github.com/user/repo.git@branch
